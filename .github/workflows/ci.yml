name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  typecheck-and-unit:
    name: Type check + unit tests (no API key)
    runs-on: ubuntu-latest
    outputs:
      has-api-key: ${{ steps.check-key.outputs.has-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Show versions
        run: |
          bun --version
          ./node_modules/.bin/tsc --version
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Unit tests
        run: bun test tests/schema.test.ts
      - name: Check API key availability
        id: check-key
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has-key=true" >> $GITHUB_OUTPUT
          else
            echo "has-key=false" >> $GITHUB_OUTPUT
          fi

  e2e-harness:
    name: E2E harness path (Flue session.task)
    runs-on: ubuntu-latest
    needs: typecheck-and-unit
    if: needs.typecheck-and-unit.outputs.has-api-key == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run harness goal
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          bun src/index.ts --goal "list the files in the current directory and tell me how many TypeScript files there are"

  e2e-workflow:
    name: E2E workflow path (Smithers DAG)
    runs-on: ubuntu-latest
    needs: typecheck-and-unit
    if: needs.typecheck-and-unit.outputs.has-api-key == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run workflow goal and verify output
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          bun src/index.ts --goal "read package.json and AGENTS.md separately, then produce a one-sentence summary of this project" | tee /tmp/summary.txt
          grep -qE '\S' /tmp/summary.txt
