name: CI

on:
  push:
    branches: [main, "claude/**", "natural-language-workflow-authoring"]
  pull_request:

jobs:
  typecheck-and-test:
    name: Type check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Show versions
        run: |
          bun --version
          ./node_modules/.bin/tsc --version
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Prepare local Smithers project marker
        run: mkdir -p .smithers/workflows
      - name: Tests
        run: bun test tests/
