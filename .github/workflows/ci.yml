name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  typecheck-and-unit:
    name: Type check + unit tests (no API key)
    runs-on: ubuntu-latest
    outputs:
      has-api-key: ${{ steps.check-key.outputs.has-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Show versions
        run: |
          bun --version
          ./node_modules/.bin/tsc --version
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Unit tests
        run: bun test tests/schema.test.ts

  e2e-harness:
    name: E2E harness path (Flue session.task)
    runs-on: ubuntu-latest
    needs: typecheck-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run harness goal
        env:
          CUSTOM_HARNESS_FAKE_PLAN: '{"path":"harness","reason":"CI deterministic harness path"}'
          CUSTOM_HARNESS_FAKE_EXECUTOR_OUTPUT: '{"result":"CI fake executor listed repository files and counted TypeScript files."}'
        run: |
          bun src/index.ts --goal "list the files in the current directory and tell me how many TypeScript files there are"

  e2e-workflow:
    name: E2E workflow path (Smithers DAG)
    runs-on: ubuntu-latest
    needs: typecheck-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run workflow goal and verify output
        env:
          CUSTOM_HARNESS_FAKE_PLAN: >-
            {"path":"workflow","reason":"CI deterministic workflow path","workflow":{"name":"ci-summary","description":"Read project files separately, then summarize.","root":{"type":"sequence","name":"ci-sequence","children":[{"type":"task","name":"Read package","prompt":"Read package.json."},{"type":"task","name":"Read agents","prompt":"Read AGENTS.md."},{"type":"task","name":"Summarize","prompt":"Produce a one-sentence project summary."}]}}}
          CUSTOM_HARNESS_FAKE_EXECUTOR_OUTPUT: '{"result":"CI fake executor completed this workflow task."}'
        run: |
          bun src/index.ts --goal "read package.json and AGENTS.md separately, then produce a one-sentence summary of this project" | tee /tmp/summary.txt
          grep -qE '\S' /tmp/summary.txt
